name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: actions-deploy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy and restart service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            cd /var/www/electronics-store-back

            echo "=== Pull latest code ==="
            git pull origin main

            echo "=== Install dependencies ==="
            ./venv/bin/pip install -r requirements.txt

            echo "=== Load production environment ==="
            export DJANGO_SETTINGS_MODULE=core.settings.prod
            set -a
            source /var/www/electronics-store-back/.env
            set +a

            echo "=== Check Django configuration ==="
            ./venv/bin/python manage.py check

            echo "=== Run migrations ==="
            ./venv/bin/python manage.py migrate --noinput

            echo "=== Restart service ==="
            sudo -n /usr/bin/systemctl daemon-reload
            sudo -n /usr/bin/systemctl restart electronics-store-back

            echo "=== Check service status ==="
            sudo -n /usr/bin/systemctl is-active electronics-store-back

            echo "Deploy completed successfully"
